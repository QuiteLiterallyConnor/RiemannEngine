title: RiemannEngine
description: GPU-first C++ sparse tensors, adaptive voxelization and 3D Gaussian splats on LibTorch and CUDA.
url: https://quiteliterallyconnor.github.io
baseurl: /RiemannEngine
repository_url: https://github.com/QuiteLiterallyConnor/RiemannEngine

remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  toc_levels: 2..3

color_scheme: dark
search_enabled: true
search:
  heading_level: 3
  button: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "GitHub": https://github.com/QuiteLiterallyConnor/RiemannEngine
  "Releases": https://github.com/QuiteLiterallyConnor/RiemannEngine/releases
  "Docker Hub": https://hub.docker.com/r/acaicia/riemannengine
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: https://github.com/QuiteLiterallyConnor/RiemannEngine
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: yellow
  important:
    title: Important
    color: red

exclude:
  - README.md
  - Doxyfile
  - Gemfile
  - Gemfile.lock
  - vendor
  - doxygen-mainpage.md
