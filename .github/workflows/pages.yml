name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'RiemannEngine/**/*.hpp'
      - 'RiemannEngine/**/*.h'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'RiemannEngine/**/*.hpp'
      - 'RiemannEngine/**/*.h'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Install Doxygen
        run: sudo apt-get update -qq && sudo apt-get install -y -qq doxygen

      - name: Build API reference (Doxygen)
        run: |
          mkdir -p build/doxygen
          doxygen docs/Doxyfile
          echo "Doxygen warnings: $(wc -l < build/doxygen/warnings.log)"
          sudo mkdir -p _site/api/reference
          sudo cp -r build/doxygen/html/. _site/api/reference/

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
